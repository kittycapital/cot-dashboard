<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COT Signal Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #151d2e;
  --bg-hover: #1c2740;
  --border: #1e293b;
  --border-active: #3b82f6;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --green: #22c55e;
  --green-dim: #166534;
  --green-bg: rgba(34,197,94,0.08);
  --red: #ef4444;
  --red-dim: #991b1b;
  --red-bg: rgba(239,68,68,0.08);
  --blue: #3b82f6;
  --yellow: #eab308;
  --cyan: #06b6d4;
  --purple: #a855f7;
  --orange: #f97316;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.mono { font-family: 'JetBrains Mono', monospace; }

/* ===== HEADER ===== */
.header {
  padding: 20px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.header-left h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text-primary);
}

.header-left h1 span { color: var(--blue); }

.header-left p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.last-update {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  text-align: right;
}

/* ===== SIGNAL SUMMARY TABLE ===== */
.summary-section { padding: 16px 24px; }

.summary-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.summary-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  font-size: 12px;
}

.summary-table th {
  background: var(--bg-secondary);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}

.summary-table th:first-child { text-align: left; }

.summary-table td {
  padding: 7px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s;
}

.summary-table td:first-child {
  text-align: left;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  color: var(--text-primary);
}

.summary-table tr:hover td { background: var(--bg-hover); }
.summary-table tr.active td { background: rgba(59,130,246,0.1); }
.summary-table tr:last-child td { border-bottom: none; }

.val-bullish { color: var(--green); }
.val-bearish { color: var(--red); }
.val-neutral { color: var(--text-muted); }

.signal-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

.signal-dot.bullish { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
.signal-dot.bearish { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,0.5); }

/* ===== TABS ===== */
.tabs-row {
  display: flex;
  gap: 4px;
  padding: 0 24px;
  flex-wrap: wrap;
}

.tab-btn {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'DM Sans', sans-serif;
}

.tab-btn:hover { color: var(--text-primary); border-color: var(--text-muted); }
.tab-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

.asset-tabs { margin-bottom: 12px; }
.signal-tabs { margin-bottom: 0; }

/* ===== PERIOD SELECTOR ===== */
.controls-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px 8px;
}

.period-btns { display: flex; gap: 3px; }

.period-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'JetBrains Mono', monospace;
}

.period-btn:hover { color: var(--text-primary); }
.period-btn.active { background: var(--bg-hover); border-color: var(--text-muted); color: var(--text-primary); }

.chart-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* ===== CHARTS ===== */
.chart-section { padding: 0 24px; }

.chart-container {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
}

.chart-container canvas { width: 100% !important; }

/* ===== SIGNAL HISTORY ===== */
.history-section { padding: 16px 24px 24px; }

.history-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  font-size: 11px;
}

.history-table th {
  background: var(--bg-secondary);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 10px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
}

.history-table th:first-child,
.history-table th:nth-child(2),
.history-table th:nth-child(3) { text-align: left; }

.history-table td {
  padding: 6px 10px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}

.history-table td:first-child,
.history-table td:nth-child(2) { text-align: left; font-family: 'DM Sans', sans-serif; }
.history-table td:nth-child(3) { text-align: left; }

.history-scroll {
  max-height: 320px;
  overflow-y: auto;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.history-scroll::-webkit-scrollbar { width: 4px; }
.history-scroll::-webkit-scrollbar-track { background: var(--bg-secondary); }
.history-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

.badge-bullish { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-dim); }
.badge-bearish { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-dim); }

.return-positive { color: var(--green); }
.return-negative { color: var(--red); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .summary-table { font-size: 10px; }
  .summary-table th, .summary-table td { padding: 5px 6px; }
  .tabs-row { gap: 3px; }
  .tab-btn { padding: 5px 10px; font-size: 11px; }
  .chart-container { padding: 10px; }
}

/* ===== LOADING ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: var(--text-muted);
  font-size: 14px;
}

.loading .spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 10px;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1><span>COT</span> Signal Dashboard</h1>
    <p>Commitments of Traders — Contrarian Positioning Analysis</p>
  </div>
  <div class="last-update mono" id="lastUpdate">Loading...</div>
</div>

<!-- SIGNAL SUMMARY TABLE -->
<div class="summary-section">
  <div class="summary-label">Signal Overview — All Assets</div>
  <div style="overflow-x:auto;">
    <table class="summary-table" id="summaryTable">
      <thead>
        <tr>
          <th>Asset</th>
          <th>Price</th>
          <th>Z-Score</th>
          <th>Signal</th>
          <th>%ile</th>
          <th>Signal</th>
          <th>Spread Z</th>
          <th>Signal</th>
        </tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>
</div>

<!-- ASSET TABS -->
<div class="tabs-row asset-tabs" id="assetTabs"></div>

<!-- CONTROLS ROW -->
<div class="controls-row">
  <div class="chart-title" id="chartTitle">Bitcoin — Price & COT</div>
  <div class="period-btns">
    <button class="period-btn" data-period="52" onclick="setPeriod(52)">1Y</button>
    <button class="period-btn active" data-period="156" onclick="setPeriod(156)">3Y</button>
    <button class="period-btn" data-period="260" onclick="setPeriod(260)">5Y</button>
    <button class="period-btn" data-period="9999" onclick="setPeriod(9999)">ALL</button>
  </div>
</div>

<!-- PRICE CHART -->
<div class="chart-section">
  <div class="chart-container">
    <canvas id="priceChart" height="220"></canvas>
  </div>
</div>

<!-- SIGNAL TYPE TABS -->
<div class="tabs-row signal-tabs" id="signalTabs">
  <button class="tab-btn active" data-signal="zscore" onclick="setSignalType('zscore')">Z-Score</button>
  <button class="tab-btn" data-signal="pctoi" onclick="setSignalType('pctoi')">% Open Interest</button>
  <button class="tab-btn" data-signal="spread" onclick="setSignalType('spread')">Comm vs NonComm Spread</button>
</div>

<!-- SIGNAL CHART -->
<div class="chart-section" style="margin-top:12px;">
  <div class="chart-container">
    <canvas id="signalChart" height="180"></canvas>
  </div>
</div>

<!-- SIGNAL HISTORY -->
<div class="history-section">
  <div class="summary-label">Signal History — <span id="historyAssetName">Bitcoin</span></div>
  <div class="history-scroll">
    <table class="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Direction</th>
          <th>Price</th>
          <th>4W Return</th>
          <th>8W Return</th>
          <th>13W Return</th>
          <th>26W Return</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
let DATA = {};
let currentAsset = 'BTC';
let currentSignal = 'zscore';
let currentPeriod = 156;
let priceChart = null;
let signalChart = null;

const ASSET_ORDER = ['BTC','ETH','SP500','NASDAQ','RUSSELL','DXY','GOLD','SILVER','COPPER','OIL'];

// ============================================================
// LOAD DATA
// ============================================================
async function loadData() {
  try {
    const resp = await fetch('data/cot_dashboard_data.json');
    DATA = await resp.json();
    initDashboard();
  } catch (e) {
    console.error('Failed to load data:', e);
    document.getElementById('lastUpdate').textContent = 'Error loading data';
  }
}

// ============================================================
// INIT
// ============================================================
function initDashboard() {
  // Build asset tabs
  const tabsEl = document.getElementById('assetTabs');
  ASSET_ORDER.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === currentAsset ? ' active' : '');
    btn.textContent = key;
    btn.setAttribute('data-asset', key);
    btn.onclick = () => setAsset(key);
    tabsEl.appendChild(btn);
  });

  buildSummaryTable();
  updateCharts();
  updateHistory();
  updateLastDate();
}

// ============================================================
// SUMMARY TABLE
// ============================================================
function buildSummaryTable() {
  const tbody = document.getElementById('summaryBody');
  tbody.innerHTML = '';

  ASSET_ORDER.forEach(key => {
    const d = DATA[key];
    const latest = d.data[d.data.length - 1];
    const tr = document.createElement('tr');
    tr.className = key === currentAsset ? 'active' : '';
    tr.onclick = () => setAsset(key);

    const priceStr = formatPrice(latest.price, key);
    
    tr.innerHTML = `
      <td>${d.name}</td>
      <td>${priceStr}</td>
      <td class="${zClass(latest.z_score)}">${latest.z_score > 0 ? '+' : ''}${latest.z_score.toFixed(2)}</td>
      <td>${signalBadge(latest.z_signal)}</td>
      <td class="${pctClass(latest.percentile)}">${latest.percentile.toFixed(0)}%</td>
      <td>${signalBadge(latest.pct_signal)}</td>
      <td class="${zClass(latest.spread_z)}">${latest.spread_z > 0 ? '+' : ''}${latest.spread_z.toFixed(2)}</td>
      <td>${signalBadge(latest.spread_signal)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function formatPrice(p, key) {
  if (['BTC','SP500','NASDAQ','RUSSELL','GOLD'].includes(key)) return p.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  if (['ETH'].includes(key)) return p.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  if (['COPPER'].includes(key)) return p.toFixed(2);
  if (['OIL','SILVER','DXY'].includes(key)) return p.toFixed(2);
  return p.toFixed(2);
}

function zClass(z) {
  if (z > 1.8) return 'val-bullish';
  if (z < -1.8) return 'val-bearish';
  return 'val-neutral';
}

function pctClass(p) {
  if (p > 90) return 'val-bearish';
  if (p < 10) return 'val-bullish';
  return 'val-neutral';
}

function signalBadge(sig) {
  if (!sig) return '<span class="val-neutral">—</span>';
  if (sig === 'bullish') return '<span class="signal-dot bullish"></span><span class="val-bullish" style="font-size:10px">BUY</span>';
  return '<span class="signal-dot bearish"></span><span class="val-bearish" style="font-size:10px">SELL</span>';
}

// ============================================================
// CHARTS
// ============================================================
function updateCharts() {
  const d = DATA[currentAsset];
  const allData = d.data;
  const sliceStart = Math.max(0, allData.length - currentPeriod);
  const data = allData.slice(sliceStart);

  document.getElementById('chartTitle').textContent = `${d.name} — Price & COT`;
  document.getElementById('historyAssetName').textContent = d.name;

  // Price Chart
  const priceCtx = document.getElementById('priceChart').getContext('2d');
  if (priceChart) priceChart.destroy();

  // Find signal points for markers
  const bullishPoints = [];
  const bearishPoints = [];
  data.forEach((row, i) => {
    const sig = currentSignal === 'zscore' ? row.z_signal :
                currentSignal === 'pctoi' ? row.pct_signal : row.spread_signal;
    if (sig === 'bullish') bullishPoints.push({x: i, y: row.price});
    if (sig === 'bearish') bearishPoints.push({x: i, y: row.price});
  });

  priceChart = new Chart(priceCtx, {
    type: 'line',
    data: {
      labels: data.map(r => r.date),
      datasets: [
        {
          label: 'Price',
          data: data.map(r => r.price),
          borderColor: '#60a5fa',
          backgroundColor: 'rgba(96,165,250,0.05)',
          borderWidth: 1.5,
          pointRadius: 0,
          fill: true,
          tension: 0.1,
          order: 2,
        },
        {
          label: 'Bullish Signal',
          data: data.map((r, i) => {
            const sig = currentSignal === 'zscore' ? r.z_signal :
                        currentSignal === 'pctoi' ? r.pct_signal : r.spread_signal;
            return sig === 'bullish' ? r.price : null;
          }),
          borderColor: 'transparent',
          backgroundColor: '#22c55e',
          pointRadius: 5,
          pointStyle: 'triangle',
          showLine: false,
          order: 1,
        },
        {
          label: 'Bearish Signal',
          data: data.map((r, i) => {
            const sig = currentSignal === 'zscore' ? r.z_signal :
                        currentSignal === 'pctoi' ? r.pct_signal : r.spread_signal;
            return sig === 'bearish' ? r.price : null;
          }),
          borderColor: 'transparent',
          backgroundColor: '#ef4444',
          pointRadius: 5,
          pointStyle: 'triangle',
          pointRotation: 180,
          showLine: false,
          order: 1,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          borderColor: '#334155',
          borderWidth: 1,
          titleFont: { family: 'JetBrains Mono', size: 11 },
          bodyFont: { family: 'JetBrains Mono', size: 11 },
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label === 'Price') return `Price: ${formatPrice(ctx.raw, currentAsset)}`;
              if (ctx.raw !== null) return ctx.dataset.label;
              return null;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(30,41,59,0.5)' },
          ticks: {
            color: '#64748b',
            font: { family: 'JetBrains Mono', size: 10 },
            maxTicksLimit: 8,
            callback: function(val) {
              const label = this.getLabelForValue(val);
              return label ? label.substring(0, 7) : '';
            }
          }
        },
        y: {
          position: 'right',
          grid: { color: 'rgba(30,41,59,0.5)' },
          ticks: {
            color: '#64748b',
            font: { family: 'JetBrains Mono', size: 10 },
            callback: v => formatPrice(v, currentAsset)
          }
        }
      }
    }
  });

  // Signal Chart
  updateSignalChart(data);
}

function updateSignalChart(data) {
  const signalCtx = document.getElementById('signalChart').getContext('2d');
  if (signalChart) signalChart.destroy();

  let chartData, thresholdLines, yLabel;

  if (currentSignal === 'zscore') {
    chartData = data.map(r => r.z_score);
    yLabel = 'Commercial Net Z-Score';
    thresholdLines = [
      { y: 1.8, color: 'rgba(34,197,94,0.4)', label: '+1.8 (Bullish)' },
      { y: -1.8, color: 'rgba(239,68,68,0.4)', label: '-1.8 (Bearish)' },
      { y: 0, color: 'rgba(100,116,139,0.3)', label: '' }
    ];
  } else if (currentSignal === 'pctoi') {
    chartData = data.map(r => r.percentile);
    yLabel = 'Non-Comm Long % OI Percentile';
    thresholdLines = [
      { y: 90, color: 'rgba(239,68,68,0.4)', label: '90th (Bearish)' },
      { y: 10, color: 'rgba(34,197,94,0.4)', label: '10th (Bullish)' },
      { y: 50, color: 'rgba(100,116,139,0.3)', label: '' }
    ];
  } else {
    chartData = data.map(r => r.spread_z);
    yLabel = 'Comm-NonComm Spread Z-Score';
    thresholdLines = [
      { y: 1.8, color: 'rgba(34,197,94,0.4)', label: '+1.8 (Bullish)' },
      { y: -1.8, color: 'rgba(239,68,68,0.4)', label: '-1.8 (Bearish)' },
      { y: 0, color: 'rgba(100,116,139,0.3)', label: '' }
    ];
  }

  // Color bars based on value
  const barColors = chartData.map(v => {
    if (currentSignal === 'pctoi') {
      if (v > 90) return 'rgba(239,68,68,0.7)';
      if (v < 10) return 'rgba(34,197,94,0.7)';
      return 'rgba(100,116,139,0.3)';
    }
    if (v > 1.8) return 'rgba(34,197,94,0.7)';
    if (v < -1.8) return 'rgba(239,68,68,0.7)';
    if (v > 0) return 'rgba(34,197,94,0.25)';
    return 'rgba(239,68,68,0.25)';
  });

  const annotations = {};
  thresholdLines.forEach((line, i) => {
    annotations[`line${i}`] = {
      type: 'line',
      yMin: line.y,
      yMax: line.y,
      borderColor: line.color,
      borderWidth: 1,
      borderDash: [4, 4],
      label: {
        display: !!line.label,
        content: line.label,
        position: 'start',
        font: { family: 'JetBrains Mono', size: 9 },
        color: line.color.replace('0.4', '0.8'),
        backgroundColor: 'transparent',
      }
    };
  });

  signalChart = new Chart(signalCtx, {
    type: 'bar',
    data: {
      labels: data.map(r => r.date),
      datasets: [{
        label: yLabel,
        data: chartData,
        backgroundColor: barColors,
        borderColor: barColors.map(c => c.replace('0.7', '0.9').replace('0.25', '0.4').replace('0.3', '0.5')),
        borderWidth: 1,
        borderRadius: 1,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        annotation: { annotations },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          borderColor: '#334155',
          borderWidth: 1,
          titleFont: { family: 'JetBrains Mono', size: 11 },
          bodyFont: { family: 'JetBrains Mono', size: 11 },
          callbacks: {
            label: ctx => `${yLabel}: ${ctx.raw.toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(30,41,59,0.5)' },
          ticks: {
            color: '#64748b',
            font: { family: 'JetBrains Mono', size: 10 },
            maxTicksLimit: 8,
            callback: function(val) {
              const label = this.getLabelForValue(val);
              return label ? label.substring(0, 7) : '';
            }
          }
        },
        y: {
          position: 'right',
          grid: { color: 'rgba(30,41,59,0.5)' },
          ticks: {
            color: '#64748b',
            font: { family: 'JetBrains Mono', size: 10 },
          }
        }
      }
    }
  });
}

// ============================================================
// SIGNAL HISTORY TABLE
// ============================================================
function updateHistory() {
  const d = DATA[currentAsset];
  const history = d.signal_history
    .filter(h => h.type === (currentSignal === 'zscore' ? 'z_score' : currentSignal === 'pctoi' ? 'pct_oi' : 'spread'))
    .reverse()
    .slice(0, 50);

  const tbody = document.getElementById('historyBody');
  tbody.innerHTML = '';

  if (history.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;">No signals for this configuration</td></tr>';
    return;
  }

  history.forEach(h => {
    const tr = document.createElement('tr');
    const typeLabel = h.type === 'z_score' ? 'Z-Score' : h.type === 'pct_oi' ? '% OI' : 'Spread';
    
    tr.innerHTML = `
      <td class="mono">${h.date}</td>
      <td>${typeLabel}</td>
      <td><span class="badge badge-${h.direction}">${h.direction === 'bullish' ? '▲ BUY' : '▼ SELL'}</span></td>
      <td class="mono">${formatPrice(h.price_at_signal, currentAsset)}</td>
      <td class="mono ${returnClass(h.returns['4w'], h.direction)}">${formatReturn(h.returns['4w'])}</td>
      <td class="mono ${returnClass(h.returns['8w'], h.direction)}">${formatReturn(h.returns['8w'])}</td>
      <td class="mono ${returnClass(h.returns['13w'], h.direction)}">${formatReturn(h.returns['13w'])}</td>
      <td class="mono ${returnClass(h.returns['26w'], h.direction)}">${formatReturn(h.returns['26w'])}</td>
    `;
    tbody.appendChild(tr);
  });
}

function formatReturn(r) {
  if (r === null || r === undefined) return '—';
  return (r > 0 ? '+' : '') + r.toFixed(1) + '%';
}

function returnClass(r, direction) {
  if (r === null || r === undefined) return '';
  // For bullish signals, positive return = correct. For bearish, negative = correct.
  if (direction === 'bullish') return r > 0 ? 'return-positive' : 'return-negative';
  return r < 0 ? 'return-positive' : 'return-negative';
}

// ============================================================
// CONTROLS
// ============================================================
function setAsset(key) {
  currentAsset = key;
  // Update tab styles
  document.querySelectorAll('#assetTabs .tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-asset') === key);
  });
  // Update summary table row highlighting
  document.querySelectorAll('#summaryBody tr').forEach((tr, i) => {
    tr.classList.toggle('active', ASSET_ORDER[i] === key);
  });
  updateCharts();
  updateHistory();
}

function setSignalType(type) {
  currentSignal = type;
  document.querySelectorAll('#signalTabs .tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-signal') === type);
  });
  updateCharts();
  updateHistory();
}

function setPeriod(weeks) {
  currentPeriod = weeks;
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.getAttribute('data-period')) === weeks);
  });
  updateCharts();
}

function updateLastDate() {
  const d = DATA[ASSET_ORDER[0]];
  const lastDate = d.data[d.data.length - 1].date;
  document.getElementById('lastUpdate').innerHTML = `Last COT: ${lastDate}<br>CFTC Weekly Report`;
}

// ============================================================
// BOOT
// ============================================================
loadData();
</script>
</body>
</html>
