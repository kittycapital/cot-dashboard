name: Weekly COT Data Update

on:
  schedule:
    # Every Saturday at 06:00 UTC (CFTC publishes Friday afternoon ET)
    - cron: '0 6 * * 6'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-cot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance pandas

      - name: Update COT data
        run: |
          python scripts/fetch_cot_real.py --update

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "📊 Weekly COT data update $(date +'%Y-%m-%d')"
          git push
